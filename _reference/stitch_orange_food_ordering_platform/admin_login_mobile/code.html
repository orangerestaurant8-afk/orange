<!DOCTYPE html>

<html class="dark" lang="en"><head>
<meta charset="utf-8"/>
<meta content="width=device-width, initial-scale=1.0" name="viewport"/>
<title>Orange Admin - Login</title>
<script src="https://cdn.tailwindcss.com?plugins=forms,container-queries"></script>
<link href="https://fonts.googleapis.com/css2?family=Montserrat:wght@400;600;700;800;900&amp;family=Inter:wght@400;600&amp;display=swap" rel="stylesheet"/>
<link href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:wght,FILL@100..700,0..1&amp;display=swap" rel="stylesheet"/>
<link href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:wght,FILL@100..700,0..1&amp;display=swap" rel="stylesheet"/>
<script id="tailwind-config">
      tailwind.config = {
        darkMode: "class",
        theme: {
          extend: {
            "colors": {
                    "surface-container-low": "#f0f3ff",
                    "on-secondary-container": "#596373",
                    "on-primary-fixed": "#341100",
                    "secondary-fixed-dim": "#bdc7d9",
                    "background": "#111827", /* Overridden to Deep Charcoal for Admin */
                    "surface-dim": "#d3daea",
                    "on-tertiary": "#ffffff",
                    "inverse-surface": "#2a313d",
                    "tertiary-fixed-dim": "#ccc5bc",
                    "on-secondary-fixed": "#121c2a",
                    "on-secondary": "#ffffff",
                    "surface-variant": "#dce2f3",
                    "on-background": "#ffffff",
                    "on-primary-fixed-variant": "#783200",
                    "inverse-primary": "#ffb690",
                    "surface-tint": "#9d4300",
                    "on-primary-container": "#582200",
                    "on-tertiary-fixed": "#1e1b15",
                    "on-tertiary-container": "#36322c",
                    "on-secondary-fixed-variant": "#3d4756",
                    "error": "#ef4444",
                    "surface-bright": "#f9f9ff",
                    "outline-variant": "#e0c0b1",
                    "tertiary": "#625e56",
                    "on-tertiary-fixed-variant": "#4a463f",
                    "secondary-container": "#1f2937",
                    "tertiary-container": "#a09a91",
                    "error-container": "#450a0a",
                    "secondary-fixed": "#d9e3f6",
                    "surface-container-lowest": "#000000",
                    "primary-fixed-dim": "#ffb690",
                    "outline": "#374151",
                    "on-surface-variant": "#9ca3af",
                    "primary-fixed": "#ffdbca",
                    "secondary": "#555f6f",
                    "surface-container-highest": "#dce2f3",
                    "on-surface": "#f9fafb",
                    "inverse-on-surface": "#ebf1ff",
                    "on-error-container": "#fca5a5",
                    "surface-container-high": "#e2e8f8",
                    "tertiary-fixed": "#e9e1d8",
                    "primary-container": "#f97316",
                    "on-error": "#ffffff",
                    "primary": "#f97316",
                    "on-primary": "#ffffff",
                    "surface-container": "#1f2937",
                    "surface": "#111827"
            },
            "borderRadius": {
                    "DEFAULT": "0.25rem",
                    "lg": "0.5rem",
                    "xl": "0.75rem",
                    "full": "9999px"
            },
            "spacing": {
                    "lg": "40px",
                    "base": "4px",
                    "md": "24px",
                    "container-max": "1280px",
                    "xs": "8px",
                    "gutter": "20px",
                    "xl": "64px",
                    "sm": "16px"
            },
            "fontFamily": {
                    "price-display": ["Montserrat"],
                    "display-lg": ["Montserrat"],
                    "headline-md": ["Montserrat"],
                    "label-md": ["Inter"],
                    "body-md": ["Inter"],
                    "body-lg": ["Inter"],
                    "headline-sm": ["Montserrat"],
                    "display-lg-mobile": ["Montserrat"],
                    "body-sm": ["Inter"]
            },
            "fontSize": {
                    "price-display": ["20px", {"lineHeight": "24px", "fontWeight": "700"}],
                    "display-lg": ["48px", {"lineHeight": "60px", "letterSpacing": "-0.02em", "fontWeight": "700"}],
                    "headline-md": ["24px", {"lineHeight": "32px", "fontWeight": "600"}],
                    "label-md": ["14px", {"lineHeight": "20px", "fontWeight": "600"}],
                    "body-md": ["16px", {"lineHeight": "24px", "fontWeight": "400"}],
                    "body-lg": ["18px", {"lineHeight": "28px", "fontWeight": "400"}],
                    "headline-sm": ["20px", {"lineHeight": "28px", "fontWeight": "600"}],
                    "display-lg-mobile": ["32px", {"lineHeight": "40px", "letterSpacing": "-0.02em", "fontWeight": "700"}],
                    "body-sm": ["14px", {"lineHeight": "20px", "fontWeight": "400"}]
            }
          },
        },
      }
    </script>
<style>
        body {
            background-color: #111827;
            color: #f9fafb;
            font-family: 'Inter', sans-serif;
            overflow: hidden;
        }
        
        .admin-canvas {
            max-width: 390px;
            margin: 0 auto;
            min-height: 100vh;
            display: flex;
            flex-direction: column;
            justify-content: center;
            padding: 24px;
            position: relative;
        }

        .glass-effect {
            background: rgba(31, 41, 55, 0.5);
            backdrop-filter: blur(8px);
            border: 1px solid rgba(255, 255, 255, 0.05);
        }

        .material-symbols-outlined {
            font-variation-settings: 'FILL' 0, 'wght' 400, 'GRAD' 0, 'opsz' 24;
        }

        /* Micro-interaction for the button */
        .btn-active:active {
            transform: scale(0.97);
        }
    </style>
<style>
    body {
      min-height: max(884px, 100dvh);
    }
  </style>
  </head>
<body class="bg-background text-on-background antialiased">
<!-- Atmospheric background light source -->
<div class="fixed top-[-10%] left-[-10%] w-[50%] h-[50%] bg-primary/10 blur-[120px] rounded-full pointer-events-none"></div>
<div class="fixed bottom-[-10%] right-[-10%] w-[50%] h-[50%] bg-primary/5 blur-[120px] rounded-full pointer-events-none"></div>
<main class="admin-canvas">
<!-- Branding Section -->
<header class="text-center mb-xl">
<div class="inline-flex items-center justify-center w-16 h-16 bg-primary-container rounded-xl shadow-lg shadow-primary/20 mb-md">
<span class="material-symbols-outlined text-white text-[32px]">shield_person</span>
</div>
<h1 class="font-headline-md text-headline-md text-on-background tracking-tight">
                Orange <span class="text-primary font-black">Admin</span>
</h1>
<p class="font-body-sm text-body-sm text-on-surface-variant mt-xs">
                Partner Portal &amp; Logistics Control
            </p>
</header>
<!-- Login Form Container -->
<section class="glass-effect p-md rounded-xl shadow-2xl">
<form class="flex flex-col gap-sm" id="loginForm" onsubmit="event.preventDefault();">
<!-- Email Field -->
<div class="flex flex-col gap-xs">
<label class="font-label-md text-label-md text-on-surface-variant" for="email">
                        Email Address
                    </label>
<div class="relative group">
<div class="absolute inset-y-0 left-0 pl-sm flex items-center pointer-events-none text-on-surface-variant group-focus-within:text-primary transition-colors">
<span class="material-symbols-outlined text-[20px]">mail</span>
</div>
<input class="w-full bg-surface-container border-outline rounded-lg py-3 pl-10 pr-sm font-body-md text-body-md text-on-surface placeholder:text-on-surface-variant/50 focus:ring-2 focus:ring-primary/20 focus:border-primary transition-all outline-none" id="email" placeholder="admin@orange.pk" required="" type="email"/>
</div>
</div>
<!-- Password Field -->
<div class="flex flex-col gap-xs">
<div class="flex justify-between items-center">
<label class="font-label-md text-label-md text-on-surface-variant" for="password">
                            Password
                        </label>
<a class="font-label-md text-label-md text-primary hover:underline" href="#">
                            Forgot?
                        </a>
</div>
<div class="relative group">
<div class="absolute inset-y-0 left-0 pl-sm flex items-center pointer-events-none text-on-surface-variant group-focus-within:text-primary transition-colors">
<span class="material-symbols-outlined text-[20px]">lock</span>
</div>
<input class="w-full bg-surface-container border-outline rounded-lg py-3 pl-10 pr-12 font-body-md text-body-md text-on-surface placeholder:text-on-surface-variant/50 focus:ring-2 focus:ring-primary/20 focus:border-primary transition-all outline-none" id="password" placeholder="••••••••" required="" type="password"/>
<button class="absolute inset-y-0 right-0 pr-sm flex items-center text-on-surface-variant hover:text-on-surface transition-colors" type="button">
<span class="material-symbols-outlined text-[20px]">visibility</span>
</button>
</div>
</div>
<!-- Remember Me -->
<div class="flex items-center gap-xs py-xs">
<input class="w-4 h-4 rounded border-outline bg-surface-container text-primary focus:ring-primary focus:ring-offset-background" id="remember" type="checkbox"/>
<label class="font-body-sm text-body-sm text-on-surface-variant select-none" for="remember">
                        Keep me signed in for 30 days
                    </label>
</div>
<!-- Submit Button -->
<button class="w-full bg-primary-container text-white font-headline-sm text-headline-sm py-4 rounded-xl shadow-lg shadow-primary/30 mt-sm btn-active hover:brightness-110 transition-all flex items-center justify-center gap-xs" type="submit">
<span>Sign In</span>
<span class="material-symbols-outlined">login</span>
</button>
</form>
</section>
<!-- Security Footer -->
<footer class="mt-xl text-center flex flex-col gap-base">
<div class="flex items-center justify-center gap-xs text-on-surface-variant/40">
<span class="material-symbols-outlined text-[16px]">verified_user</span>
<span class="font-label-md text-label-md uppercase tracking-widest text-[10px]">Secure Admin Gateway</span>
</div>
<p class="font-body-sm text-body-sm text-on-surface-variant/60">
                IP: 182.168.1.42 • Pakistan
            </p>
</footer>
</main>
<script>
        // Simple micro-interaction for password visibility
        const toggleBtn = document.querySelector('button[type="button"]');
        const passwordInput = document.getElementById('password');
        let isVisible = false;

        toggleBtn.addEventListener('click', () => {
            isVisible = !isVisible;
            passwordInput.type = isVisible ? 'text' : 'password';
            toggleBtn.innerHTML = `<span class="material-symbols-outlined text-[20px]">${isVisible ? 'visibility_off' : 'visibility'}</span>`;
        });

        // Form feedback simulation
        const loginForm = document.getElementById('loginForm');
        loginForm.addEventListener('submit', () => {
            const btn = loginForm.querySelector('button[type="submit"]');
            const originalContent = btn.innerHTML;
            
            btn.disabled = true;
            btn.innerHTML = `<div class="w-6 h-6 border-2 border-white/30 border-t-white rounded-full animate-spin"></div>`;
            
            setTimeout(() => {
                btn.innerHTML = originalContent;
                btn.disabled = false;
            }, 1500);
        });
    </script>
</body></html>
