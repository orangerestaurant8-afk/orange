<style>
        body {
            /* Deep charcoal background as requested */
            background-color: #111827; 
            margin: 0;
            padding: 0;
            display: flex;
            align-items: center;
            justify-content: center;
            min-height: 100vh;
            overflow: hidden;
        }

        .material-symbols-outlined {
            font-variation-settings: 'FILL' 0, 'wght' 400, 'GRAD' 0, 'opsz' 24;
            vertical-align: middle;
        }

        .login-card {
            background-color: #1f2937; /* Slightly lighter charcoal for the card */
            border: 1px solid rgba(255, 255, 255, 0.05);
            box-shadow: 0px 12px 32px rgba(0, 0, 0, 0.4);
        }

        .input-high-contrast {
            background-color: #111827;
            border: 1px solid #374151;
            color: #f9fafb;
            transition: border-color 0.2s, box-shadow 0.2s;
        }

        .input-high-contrast:focus {
            border-color: #f97316;
            box-shadow: 0 0 0 2px rgba(249, 115, 22, 0.2);
            outline: none;
        }

        /* Ambient animation for subtle background texture */
        .ambient-mesh {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            opacity: 0.05;
            pointer-events: none;
            z-index: -1;
        }
    </style>
</head>
<body class="antialiased">
<!-- Ambient Subtle Background -->
<div class="ambient-mesh">

</div>
<main class="w-full max-w-[1440px] flex items-center justify-center p-md">
<!-- Login Container -->
<div class="login-card w-full max-w-md rounded-xl p-lg flex flex-col items-center">
<!-- Branding: Orange Merchant/Admin -->
<div class="mb-xl text-center">
<div class="flex items-center justify-center gap-xs mb-base">
<span class="material-symbols-outlined text-primary-container text-4xl" style="font-variation-settings: 'FILL' 1;">restaurant</span>
<h1 class="font-display-lg text-headline-md text-white tracking-tight">
                        ORANGE<span class="text-primary-container font-black ml-1">ADMIN</span>
</h1>
</div>
<p class="font-body-sm text-on-secondary-container tracking-wide uppercase font-semibold text-xs">
                    Merchant Partner Portal
                </p>
</div>
<!-- Form -->
<form class="w-full space-y-md" id="loginForm" onsubmit="handleLogin(event)">
<!-- Email Field -->
<div class="space-y-xs">
<label class="font-label-md text-label-md text-surface-variant block" for="email">
                        Email Address
                    </label>
<div class="relative">
<span class="material-symbols-outlined absolute left-3 top-1/2 -translate-y-1/2 text-on-secondary-container text-sm">mail</span>
<input class="input-high-contrast w-full rounded-lg px-xl py-3 font-body-md text-body-md pl-10" id="email" name="email" placeholder="name@orangefood.pk" required="" type="email"/>
</div>
</div>
<!-- Password Field -->
<div class="space-y-xs">
<div class="flex justify-between items-center">
<label class="font-label-md text-label-md text-surface-variant block" for="password">
                            Password
                        </label>
<a class="font-label-md text-body-sm text-primary-container hover:underline transition-all" href="#">
                            Forgot Password?
                        </a>
</div>
<div class="relative">
<span class="material-symbols-outlined absolute left-3 top-1/2 -translate-y-1/2 text-on-secondary-container text-sm">lock</span>
<input class="input-high-contrast w-full rounded-lg px-xl py-3 font-body-md text-body-md pl-10" id="password" name="password" placeholder="••••••••" required="" type="password"/>
<button class="absolute right-3 top-1/2 -translate-y-1/2 text-on-secondary-container hover:text-white transition-colors" onclick="togglePassword()" type="button">
<span class="material-symbols-outlined text-sm" id="eye-icon">visibility</span>
</button>
</div>
</div>
<!-- Remember Me -->
<div class="flex items-center gap-xs">
<input class="w-4 h-4 rounded border-gray-700 bg-gray-900 text-primary-container focus:ring-primary-container" id="remember" type="checkbox"/>
<label class="font-body-sm text-body-sm text-on-secondary-container cursor-pointer select-none" for="remember">
                        Keep me signed in for 30 days
                    </label>
</div>
<!-- CTA Button -->
<button class="w-full bg-primary-container text-on-primary-fixed font-headline-sm py-3 rounded-lg hover:brightness-110 active:scale-[0.98] transition-all flex items-center justify-center gap-xs" type="submit">
<span>Sign In</span>
<span class="material-symbols-outlined text-lg">arrow_forward</span>
</button>
</form>
<!-- Footer Note -->
<div class="mt-xl text-center space-y-xs">
<p class="font-body-sm text-body-sm text-on-secondary-container">
                    Authorized Access Only
                </p>
<div class="flex items-center justify-center gap-base text-[10px] text-on-secondary-container/50 uppercase tracking-widest font-bold">
<span class="material-symbols-outlined text-[12px]">security</span>
<span>256-Bit SSL Encrypted Connection</span>
</div>
</div>
</div>
</main>
<!-- Micro-interactions Script -->
<script>
        function togglePassword() {
            const pwd = document.getElementById('password');
            const icon = document.getElementById('eye-icon');
            if (pwd.type === 'password') {
                pwd.type = 'text';
                icon.innerText = 'visibility_off';
            } else {
                pwd.type = 'password';
                icon.innerText = 'visibility';
            }
        }

        function handleLogin(e) {
            e.preventDefault();
            const btn = e.target.querySelector('button[type="submit"]');
            const originalContent = btn.innerHTML;
            
            // Loading State
            btn.disabled = true;
            btn.innerHTML = `<span class="material-symbols-outlined animate-spin">progress_activity</span> <span>Authenticating...</span>`;
            
            // Simulate delay
            setTimeout(() => {
                // Return to normal (simulation)
                btn.disabled = false;
                btn.innerHTML = originalContent;
                alert('Authentication system simulation. Please use valid merchant credentials.');
            }, 1500);
        }

        // Add subtle parallax effect to the card based on mouse move
        document.addEventListener('mousemove', (e) => {
            const card = document.querySelector('.login-card');
            const xAxis = (window.innerWidth / 2 - e.pageX) / 100;
            const yAxis = (window.innerHeight / 2 - e.pageY) / 100;
            card.style.transform = `rotateY(${xAxis}deg) rotateX(${yAxis}deg)`;
        });
    </script>
</body></html>
